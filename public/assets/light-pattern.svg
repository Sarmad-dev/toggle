<!-- Light Theme Background SVG -->
<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6E4E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  
  <!-- Abstract Circles -->
  <circle cx="30" cy="30" r="10" fill="rgba(255, 255, 255, 0.5)" />
  <circle cx="70" cy="70" r="15" fill="rgba(255, 255, 255, 0.3)" />
  <circle cx="110" cy="40" r="8" fill="rgba(255, 255, 255, 0.4)" />
  <circle cx="150" cy="80" r="12" fill="rgba(255, 255, 255, 0.6)" />
  
  <!-- Connecting Lines -->
  <line x1="30" y1="30" x2="70" y2="70" stroke="#fff" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="70" y1="70" x2="150" y2="80" stroke="#fff" stroke-width="1" stroke-dasharray="5,5" />
</svg>
